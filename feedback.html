<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCampus - Faculty Feedback</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🎓</div>
                <span class="sidebar-title">SmartCampus</span>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <span class="nav-icon">📊</span>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="notices.html" class="nav-link">
                            <span class="nav-icon">📢</span>
                            Notices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="complaints.html" class="nav-link">
                            <span class="nav-icon">📝</span>
                            Complaints
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="feedback.html" class="nav-link active">
                            <span class="nav-icon">⭐</span>
                            Feedback
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="lost-found.html" class="nav-link">
                            <span class="nav-icon">🔍</span>
                            Lost & Found
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="emergency.html" class="nav-link">
                            <span class="nav-icon">🚨</span>
                            Emergency
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-nav">
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="Search...">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="top-nav-right">
                    <button class="notification-btn">
                        🔔
                        <span class="notification-badge"></span>
                    </button>
                    <div class="user-profile">
                        <div class="user-avatar">A</div>
                        <div class="user-info">
                            <h4>Arjun Sharma</h4>
                            <p>Student</p>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Page Content -->
            <div class="content-area">
                <form class="feedback-form">
                    <div class="feedback-header">
                        <h1 class="feedback-title">Faculty Feedback Form</h1>
                    </div>

                    <div class="feedback-content">
                        <div class="feedback-selects">
                            <div class="form-group">
                                <label class="form-label">Semester:</label>
                                <!-- ✅ FIX -->
                                <select class="form-select" name="semester">
                                    <option value="">Select semester</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Subject Name:</label>
                                <!-- ✅ FIX -->
                                <select class="form-select" name="subject">
                                    <option value="">Select subject</option>
                                    <option value="math">Mathematics</option>
                                    <option value="physics">Physics</option>
                                    <option value="chemistry">Chemistry</option>
                                    <option value="cs">Computer Science</option>
                                    <option value="english">English</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Faculty:</label>
                                <!-- ✅ FIX -->
                                <select class="form-select" name="faculty">
                                    <option value="">Select faculty</option>
                                    <option value="prof1">Dr. John Smith</option>
                                    <option value="prof2">Prof. Sarah Johnson</option>
                                    <option value="prof3">Dr. Michael Brown</option>
                                    <option value="prof4">Prof. Emily Davis</option>
                                </select>
                            </div>
                        </div>

                        <!-- REST OF YOUR CODE SAME -->
                        <!-- (No changes below this point) -->

                        <div class="rating-section">
                            <div class="rating-instruction">
                                Please rate the faculty on the following criteria:
                            </div>

                            <!-- ALL rating items unchanged -->
                            <!-- (kept exactly same as your code) -->

                            <!-- ... your full rating code stays same ... -->

                        </div>

                        <div class="feedback-actions">
                            <button type="submit" class="feedback-btn feedback-submit">Submit</button>
                            <button type="button" class="feedback-btn feedback-reset">Reset</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/feedback.js"></script>
</body>
</html>
