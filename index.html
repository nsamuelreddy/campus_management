<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCampus - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-google-client-id="624797960394-5jua4vjq39v027c129qp9l9ntrvivobi.apps.googleusercontent.com">
    <div class="login-container">
        <div class="login-ambient" aria-hidden="true">
            <span class="orb orb-1"></span>
            <span class="orb orb-2"></span>
            <span class="orb orb-3"></span>
            <span class="grid-glow"></span>
        </div>
        <div class="login-card">
            <div class="logo">🎓</div>
            <h1 class="login-title">Smart Campus</h1>
            <p class="login-subtitle">Campus Management System</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="text" id="email" class="form-input" placeholder="Enter your email or ID" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="role-selection">
                        <button type="button" class="role-btn active" data-role="student">Student</button>
                        <button type="button" class="role-btn" data-role="faculty">Faculty</button>
                        <button type="button" class="role-btn" data-role="admin">Admin</button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="oauth-divider"><span>or</span></div>
            <div id="googleSignInButton" class="google-signin-wrap"></div>
            <p id="googleSignInStatus" class="google-signin-status" aria-live="polite"></p>
            
            <p class="demo-text">Demo login: student@project.com / student123, faculty@project.com / faculty123, admin@campus.edu / admin123</p>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/main.js"></script>
</body>
</html>
